<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Planner</title>
<link rel="stylesheet" href="local/obsidian.css?v=0.3.20">
<script src="local/storage.js?v=0.3.11" defer></script>
<script src="local/calendar.js?v=0.3.11" defer></script>
<script src="local/i18n.js?v=0.3.20" defer></script>
<script src="local/app.js?v=0.3.20" defer></script>
</head>
<body>
<a class="skip" href="#main"><span data-text="Sari la conținut">Skip to content</span></a>
<header class="top">
  <h1 class="brand">Leave Planner</h1>
</header>
<main id="main" tabindex="-1">
  <div class="workspace">
  <section class="stats" aria-label="Annual balance" data-label="Sold anual">
    <article><span><span data-text="Disponibile">Available</span> <span id="year"></span></span><strong id="available"></strong><small id="carry">leave days</small></article>
    <article><span><span data-text="Rezervate">Reserved</span></span><strong id="reserved"></strong><small><span data-text="planificate și în așteptare">planned and pending</span></small></article>
    <article><span><span data-text="Efectuate">Taken</span></span><strong id="used"></strong><small><span data-text="zile confirmate">confirmed days</span></small></article>
  </section>
  <div class="backup-tools">
    <div class="actions">
      <button id="export"><span data-text="Exportă backup">Export backup</span></button>
      <button id="import"><span data-text="Importă backup">Import backup</span></button>
      <input type="file" id="backup-file" accept=".json,application/json" hidden>
    </div>
    <p id="feedback" role="alert"></p>
  </div>
    <section class="panel calendar-panel" aria-labelledby="month">
      <div class="panel-head">
        <div><p class="eyebrow"><span data-text="CALENDAR">CALENDAR</span></p><h2 id="month" aria-live="polite"></h2></div>
        <div class="arrows"><button id="prev" aria-label="Previous month" data-label="Luna anterioară">‹</button><button id="next" aria-label="Next month" data-label="Luna următoare">›</button></div>
      </div>
      <div class="week" aria-hidden="true"><span><span data-text="Lun">Mon</span></span><span><span data-text="Mar">Tue</span></span><span><span data-text="Mie">Wed</span></span><span><span data-text="Joi">Thu</span></span><span><span data-text="Vin">Fri</span></span><span><span data-text="Sâm">Sat</span></span><span><span data-text="Dum">Sun</span></span></div>
      <div class="calendar" id="calendar" aria-label="Days of the month" data-label="Zilele lunii"></div>
      <p class="legend">
        <span><span class="legend-key leave" aria-hidden="true">●</span> <span data-text="Concediu activ">Active leave</span></span>
        <span><span class="legend-key holiday" aria-hidden="true">✦</span> <span data-text="Sărbătoare legală">Public holiday</span></span>
        <span><span class="legend-key weekend" aria-hidden="true"></span> <span data-text="Weekend">Weekend</span></span>
        <span><span class="legend-key workday" aria-hidden="true"></span> <span data-text="Zi lucrătoare">Working day</span></span>
      </p>
    </section>
    <section class="panel register-panel" aria-labelledby="entries-title">
      <div class="panel-head"><div><p class="eyebrow"><span data-text="REGISTRU">REGISTER</span></p><h2 id="entries-title"><span data-text="Înregistrări">Entries</span></h2></div></div>
      <div class="filters" aria-label="Filter entries" data-label="Filtru înregistrări">
        <button data-filter="active" aria-pressed="true"><span data-text="Active">Active</span></button>
        <button data-filter="history" aria-pressed="false"><span data-text="Istoric">History</span></button>
        <button data-filter="deleted" aria-pressed="false"><span data-text="Șterse">Deleted</span></button>
      </div>
      <div id="entries"></div>
    </section>
  </div>
</main>
<details id="language-picker" class="language-picker">
  <summary id="language-toggle" aria-label="Language" aria-describedby="language-name" data-label="Limbă"><span id="language-flag" class="flag flag-en" aria-hidden="true"></span><span id="language-name" lang="en">English</span></summary>
  <div class="language-options">
    <button type="button" lang="en" data-language="en" aria-pressed="true"><span class="flag flag-en" aria-hidden="true"></span>English</button>
    <button type="button" lang="fr" data-language="fr" aria-pressed="false"><span class="flag flag-fr" aria-hidden="true"></span>Français</button>
    <button type="button" lang="es" data-language="es" aria-pressed="false"><span class="flag flag-es" aria-hidden="true"></span>Español</button>
    <button type="button" lang="it" data-language="it" aria-pressed="false"><span class="flag flag-it" aria-hidden="true"></span>Italiano</button>
  </div>
</details>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="panel-head"><h2 id="dialog-title"></h2><button id="close" aria-label="Close" data-label="Închide">×</button></div>
  <div id="dialog-body"></div>
</dialog>
<template id="leave-form">
  <form>
    <div class="fields">
      <label><span data-text="Data de început">Start date</span><input name="start" type="date" required></label>
      <label><span data-text="Data de sfârșit">End date</span><input name="end" type="date" required></label>
    </div>
    <div class="fields">
      <label><span data-text="Tip">Type</span><select name="type"><option value="Concediu de odihnă" data-text="Concediu de odihnă">Annual leave</option><option value="Altă absență" data-text="Altă absență">Other absence</option></select></label>
      <label><span data-text="Stare">Status</span><select name="status"><option value="Planificat" data-text="Planificat">Planned</option><option value="În așteptare" data-text="În așteptare">Pending</option><option value="Efectuat" data-text="Efectuat">Taken</option></select></label>
    </div>
    <label><span data-text="Notițe">Notes</span> <small><span data-text="(opțional)">(optional)</span></small><textarea name="notes" rows="3" maxlength="500"></textarea></label>
    <p class="estimate" aria-live="polite"></p>
    <p class="error" role="alert"></p>
    <button type="submit" class="primary"><span data-text="Salvează concediul">Save leave</span></button>
  </form>
</template>
</body>
</html>
